name: "Bug Report"
description: "Something isn't working the way it should"

title: "[Bug]: "
labels: ["bug", "needs-triage"]

body:
  - type: "markdown"
    attributes:
      value: "Thanks for taking the time to report a bug! :]"

  - type: "checkboxes"
    id: "preflight"
    attributes:
      label: "Before you submit"
      options:
        - label: "I searched existing issues and didn't find a duplicate"
          required: true
        - label: "I tried the latest release"
          required: false

  - type: "input"
    id: "version"
    attributes:
      label: "What version are you using?"
      description: "Run the app with `--version` to find this."
      placeholder: "1.0.0"
    validations:
      required: true

  - type: "dropdown"
    id: "operating-system"
    attributes:
      label: "What OS are you using?"
      options:
        - "Linux"
        - "macOS"
        - "Windows"
        - "Other"
    validations:
      required: true

  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "What steps can be taken to reproduce this?"
      description: "Include the exact commands you ran, and attach any relevant files if possible."
      placeholder: |
        1. Do foo bar baz...
        2. Run `qux quux corge`...
        3. Witness the grault!
    validations:
      required: true

  - type: "textarea"
    id: "expected-actual"
    attributes:
      label: "What did you expect, and what happened instead?"
      description: "Include any output, errors, or logs."
    validations:
      required: true

  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Anything other important info?"
      description: "Include any other details that might be relevant, such as when the problem started or related issues."
    validations:
      required: false
